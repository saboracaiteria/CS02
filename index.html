<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>FPS Multiplayer Template</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	
		<style>
		@media screen and (orientation: portrait) {
		    #rotate-screen { display: flex !important; }
		    #canvas { display: none !important; }
		}
		#rotate-screen {
		    display: none;
		    position: fixed;
		    top: 0; left: 0; width: 100vw; height: 100vh;
		    background: #050505;
		    z-index: 9999999;
		    flex-direction: column;
		    align-items: center;
		    justify-content: center;
		    color: #ffd700;
		    font-family: Arial, sans-serif;
		    text-align: center;
		    padding: 20px;
		    box-sizing: border-box;
		}
		.rotate-icon {
		    width: 60px; height: 100px;
		    margin-bottom: 20px;
		    border: 4px solid #00f3ff;
		    border-radius: 10px;
		    animation: rotateAnim 2.5s infinite ease-in-out;
		}
		@keyframes rotateAnim {
		    0% { transform: rotate(0deg); }
		    50% { transform: rotate(90deg); }
		    100% { transform: rotate(90deg); }
		}
		</style>
		<div id="rotate-screen">
		    <div class="rotate-icon"></div>
		    <h1 style="font-size: 28px; text-transform: uppercase;">GIRE O CELULAR</h1>
		    <p style="color: #00f3ff; font-size: 16px;">Modo paisagem obrigatório para operar taticamente.</p>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
		<script>eruda.init();</script>
		<script>
			// --- NATIVE UNLOCK V2460 🔓🏙️ ---
			(function() {
				const originalGetContext = HTMLCanvasElement.prototype.getContext;
				HTMLCanvasElement.prototype.getContext = function(type, attributes) {
					if (type === 'webgl' || type === 'webgl2') {
						attributes = attributes || {};
						attributes.preserveDrawingBuffer = true; // PERMITE PRINT E GRAVAÇÃO 📸
						attributes.alpha = true;
						attributes.antialias = true;
					}
					return originalGetContext.call(this, type, attributes);
				};
				
				// DESBLOQUEIA EVENTOS NATIVOS 🔓🏙️ (RESTAURADOS V2080)
				window.addEventListener('contextmenu', e => {}, true);
				window.addEventListener('touchstart', e => {}, {passive: true});
				// Keydown removido para não travar o Godot!
			})();
			
			function forceReload() {
				if ('serviceWorker' in navigator) {
					navigator.serviceWorker.getRegistrations().then(function(registrations) {
						for(let registration of registrations) { registration.unregister(); }
					});
				}
				if ('caches' in window) {
					caches.keys().then(function(names) {
						for (let name of names) caches.delete(name);
					});
				}
				localStorage.clear();
				sessionStorage.clear();
				window.location.href = window.location.origin + window.location.pathname + '?v=' + Date.now();
			}
		</script>
		<button id="reloadButton" onclick="forceReload()" style="position:fixed;top:15px;right:15px;z-index:9999;background:rgba(0,0,0,0.6);color:#ffd700;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,215,0,0.5);cursor:pointer;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(5px);box-shadow:0 4px 10px rgba(0,0,0,0.5);">🔄</button>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":16980016,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
